<meta name="referrer" content="strict-origin-when-cross-origin">
<!-- Lumio moved to lumiotv.github.io: the old address forwards there (same page, keeps #/party/… links) -->
<script>if (location.hostname === 'akalkandari.github.io') location.replace('https://lumiotv.github.io/' + location.search + location.hash);
// Lumio is never shown inside another site's frame (that could trick a tap onto a hidden button)
if (window.top !== window.self) { try { window.top.location.replace(window.location.href); } catch { document.documentElement.style.display = 'none'; } }</script>
