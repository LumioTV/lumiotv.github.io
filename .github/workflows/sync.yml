name: Sync Lumio web
on:
  push:
  schedule: [{ cron: '*/15 * * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git clone --depth 1 https://github.com/Akalkandari/Lumio-web /tmp/src
          rsync -a --delete --exclude .git --exclude .github /tmp/src/ ./
          git config user.name "Lumio sync"
          git config user.email "sync@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Sync website" && git push)
